name: Build libmoanmod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for arm64 and arm32
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          FLAGS="-std=c++17 -O2 -fPIC -shared -fvisibility=hidden -static-libstdc++ -Wl,-z,max-page-size=16384 -Wl,--gc-sections -s"
          mkdir -p out/arm64-v8a out/armeabi-v7a
          "$BIN/aarch64-linux-android24-clang++" $FLAGS moanmod_all.cpp -o out/arm64-v8a/libmoanmod.so -llog -lOpenSLES -ldl
          "$BIN/armv7a-linux-androideabi24-clang++" $FLAGS moanmod_all.cpp -o out/armeabi-v7a/libmoanmod.so -llog -lOpenSLES -ldl
          ls -l out/*/

      - uses: actions/upload-artifact@v4
        with:
          name: libmoanmod
          path: out
